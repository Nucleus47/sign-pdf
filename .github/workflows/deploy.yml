name: Deploy

# Publishes the Cloudflare Worker in packages/relay, which serves the built web app.
# Production only, and only when the repository variable DEPLOY_ENABLED is "true".
# Runs when the CI workflow finishes for a push to main, and publishes only if every
# CI job (check and e2e) passed; it then builds and publishes that same commit.
# Pull requests never deploy and never see deploy credentials.
# CI runs on every push to main. If CI ever skips paths (docs only), change this too:
# the tip check below would then skip a code commit that a docs-only commit follows.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time. A deploy for a commit that is no longer the tip of main stops
# (see below), so CI finishing out of order or a re-run cannot publish older code.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stop unless this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now $tip; skipping the deploy of $TESTED. The newer commit's CI run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.tip.outputs.current == 'true'
        with:
          # The commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.tip.outputs.current == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 22
          # No dependency cache: a poisoned cache would run with this job's rights.
      - run: pnpm install --frozen-lockfile
        if: steps.tip.outputs.current == 'true'
      # CI ran the typecheck, lint, unit and end-to-end tests on this commit.
      # The build runs the browser-target check again on what is published.
      - run: pnpm build
        if: steps.tip.outputs.current == 'true'
        env:
          # The commit stamp in error reports: the commit checked out and built above.
          APP_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        if: steps.tip.outputs.current == 'true'
        env:
          # Keep wrangler's logs in the runner's temp directory.
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
          WRANGLER_SEND_METRICS: "false"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Worker in packages/relay serves packages/web/dist (built above) as static assets.
          # The token needs Workers Scripts Edit, Workers Routes Edit and Account Settings Read.
          workingDirectory: packages/relay
          # Use the wrangler version pinned in the lockfile, installed above.
          packageManager: pnpm
          command: deploy
      - name: Verify live static files match the build and missing files return 404
        if: steps.tip.outputs.current == 'true'
        env:
          ORIGIN: https://sign.silv.app
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          for asset in demo-request.json skill.md; do
            matched=false
            for attempt in $(seq 1 10); do
              if curl -fsSL "$ORIGIN/$asset?v=$TESTED" -o "$RUNNER_TEMP/$asset" && cmp -s "packages/web/dist/$asset" "$RUNNER_TEMP/$asset"; then
                matched=true
                break
              fi
              sleep 3
            done
            if [ "$matched" != "true" ]; then
              echo "::error::Live $ORIGIN/$asset does not match packages/web/dist/$asset after deploy"
              exit 1
            fi
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" "$ORIGIN/missing-$TESTED.json")
          if [ "$status" != "404" ]; then
            echo "::error::Expected 404 for missing static file, got $status"
            exit 1
          fi

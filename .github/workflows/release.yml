name: npm release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
    steps:
      # The runner context is not available in job-level env, so set this per step.
      - name: Set the release directory
        run: echo "RELEASE_DIR=$RUNNER_TEMP/sign-pdf-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache: a poisoned cache would run with this job's rights.
      - run: pnpm install --frozen-lockfile
      - name: Run required checks
        run: pnpm check
      - name: Run integration checks
        run: pnpm test:integration
      - name: Prepare a clean artifact directory
        run: rm -rf "$RELEASE_DIR" && mkdir -p "$RELEASE_DIR"
      - name: Pack publishable tarballs
        run: pnpm release:pack -- --out "$RELEASE_DIR"
      - name: Smoke-test installed tarballs without a checkout
        run: pnpm release:smoke -- "$RELEASE_DIR"
      - name: Install npm with trusted-publishing support
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true' }}
        run: npm install --global 'npm@^11.5.1'
      - name: Publish both packages with provenance
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true' }}
        run: |
          for tarball in "$RELEASE_DIR"/*.tgz; do
            npm publish "$tarball" --provenance --access public
          done
      - name: Clean local artifacts
        if: ${{ always() }}
        run: rm -rf "$RELEASE_DIR"

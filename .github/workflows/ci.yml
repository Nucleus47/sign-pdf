name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # All jobs run on the self-hosted u2 runner (private repository only). If it is
  # down, jobs queue; they never fall back to GitHub-hosted minutes.
  # A pull request from a fork never runs on the self-hosted runner: its code is
  # untrusted. Before the repository goes public, move CI to GitHub-hosted runners.
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, u2-server]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          # Per-runner install path: the default (~/setup-pnpm) is shared by every
          # runner on the self-hosted machine and races between concurrent jobs.
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The self-hosted machine keeps a persistent pnpm store shared with
          # other repositories; caching it here would upload all of it.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes eslint-plugin-compat against the browser target (docs/browser-support.md).
      - run: pnpm lint
      - run: pnpm test
      # The web build ends with the browser-target check on the bundle (packages/web/scripts/check-bundle.mjs).
      - run: pnpm build
      # Self-hosted runners keep the workspace between jobs: leave nothing behind.
      - name: Clean workspace (self-hosted)
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: git reset --hard --quiet && git clean -ffdx --quiet

  # The Playwright version the lockfile resolves, so the e2e container image matches it.
  playwright-version:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, u2-server]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the Playwright version from the lockfile
        id: read
        run: |
          versions=$(grep -oE "^  playwright@[0-9]+\.[0-9]+\.[0-9]+:" pnpm-lock.yaml | sed -E 's/^  playwright@(.*):$/\1/' | sort -u)
          if [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one resolved playwright version in pnpm-lock.yaml, got: ${versions:-none}"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  # End-to-end tests: Chromium against the production build, under the real CSP.
  # The official Playwright image ships Chromium and its system packages, so no apt step can stall (#85).
  e2e:
    needs: playwright-version
    runs-on: [self-hosted, u2-server]
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sign-pdf/web test:e2e
      # The built command-line tool and the MCP server hand a document to the built web app.
      - run: pnpm test:integration
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      # The container runs as root on a shared self-hosted workspace: hand its files
      # back to the runner user, or the next job's checkout cannot clean them.
      - name: Return workspace ownership to the runner user
        if: ${{ always() }}
        run: chown -R "$(stat -c %u:%g /__w)" /__w

  # The relay round trip (packages/web/e2e/relay-worker.spec.ts): the built app
  # and the relay API under a local `wrangler dev` with the dev outbox and
  # Turnstile off. No Cloudflare account is used.
  relay-e2e:
    needs: playwright-version
    runs-on: [self-hosted, u2-server]
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    env:
      RELAY_E2E_URL: http://127.0.0.1:8788
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sign-pdf/web build
      - name: Start the relay Worker
        working-directory: packages/relay
        run: |
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8788 \
            --var RELAY_MODE:on --var TURNSTILE_MODE:off --var MAIL_TRANSPORT:dev-outbox \
            --var RELAY_SESSION_SECRET:dev-only-insecure-relay-session-secret \
            --var PUBLIC_ORIGIN:http://127.0.0.1:8788 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          timeout 90 bash -c 'until curl -sf "$RELAY_E2E_URL/relay/config" > /dev/null; do sleep 1; done'
      - run: pnpm --filter @sign-pdf/web exec playwright test -c playwright.relay.config.ts
      - name: Stop the relay Worker
        if: ${{ always() }}
        working-directory: packages/relay
        run: |
          if [ -f wrangler.pid ]; then kill "$(cat wrangler.pid)" || true; fi
          cat wrangler.log || true
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: relay-playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      # The container runs as root on a shared self-hosted workspace: hand its files
      # back to the runner user, or the next job's checkout cannot clean them.
      - name: Return workspace ownership to the runner user
        if: ${{ always() }}
        run: chown -R "$(stat -c %u:%g /__w)" /__w
